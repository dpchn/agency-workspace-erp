# One-command local stack:  docker compose up --build
# Web: http://localhost:3000   API: http://localhost:8080/swagger-ui
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/erp
      DB_APP_USER: erp_app
      DB_APP_PASSWORD: erp_app
      DB_OWNER_USER: erp_owner
      DB_OWNER_PASSWORD: erp_owner
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}
      CORS_ORIGINS: http://localhost:3000
      BRAND_NAME: ${BRAND_NAME:-DutyGrid}
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-DutyGrid}
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  dbdata:
