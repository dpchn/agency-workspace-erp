# Builds the guard/supervisor Android app on every push that touches mobile/ (or manually).
# Download: repo -> Releases -> "Android app (latest)" -> app-release.apk
#
# Optional repository settings (Settings -> Secrets and variables -> Actions -> Variables):
#   API_URL      default server pre-filled on the login screen, e.g. https://erp.youragency.com
#   BRAND_NAME   app name shown in the app (launcher label: mobile/android/app/src/main/res/values/strings.xml)
#   BRAND_COLOR  e.g. 0xFF1D4ED8
name: Android app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=API_URL="${{ vars.API_URL }}" \
            ${{ vars.BRAND_NAME && format('--dart-define=BRAND_NAME="{0}"', vars.BRAND_NAME) || '' }} \
            ${{ vars.BRAND_COLOR && format('--dart-define=BRAND_COLOR={0}', vars.BRAND_COLOR) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish to Releases (rolling "mobile-latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Android app (latest)
          prerelease: true
          make_latest: false
          body: |
            Guard & supervisor app built from ${{ github.sha }}.
            Install: download app-release.apk on the phone, allow "install unknown apps", open it.
            Sign in with your mobile number/e-mail; enter your agency server address once.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
